<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ZENITH - Cyber Security Suite</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <div class="header">
      <div class="brand">
        <span class="logo-icon">🛡️</span>
        <div class="brand-text">
          <h1>ZENITH</h1>
          <p class="subtitle">Cyber Security & AI Fact Suite</p>
        </div>
      </div>
      <div class="status-indicator">
        <span class="status-dot online"></span>
        <span class="status-text">Active</span>
      </div>
    </div>

    <!-- Clean API Service Status Indicator -->
    <div class="api-status-bar" style="margin: -4px 0 10px 0; padding: 6px 10px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 10px; display: flex; align-items: center; justify-content: space-between; font-family: monospace; font-size: 11px;">
      <span style="color: #34d399; font-weight: bold; display: flex; align-items: center; gap: 6px;">
        <span style="width: 7px; height: 7px; background: #34d399; border-radius: 50%; display: inline-block;"></span>
        API SERVICE: ONLINE
      </span>
      <span style="color: #94a3b8; font-size: 10px;">Threat Feeds Live</span>
    </div>

    <!-- Stats Cards Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Total Threats</span>
        <span class="stat-value text-cyan" id="stat-total">--</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Phishing</span>
        <span class="stat-value text-red" id="stat-phishing">--</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Fake News</span>
        <span class="stat-value text-orange" id="stat-fakenews">--</span>
      </div>
    </div>

    <!-- Scanner Section -->
    <div class="section-card">
      <label class="input-label" for="url-input">Inspect Link or Claim</label>
      <div class="input-group">
        <input type="text" id="url-input" placeholder="Paste URL or news text..." />
        <button id="scan-btn" class="btn-primary">Scan</button>
      </div>

      <!-- Result Container -->
      <div id="result-box" class="result-box hidden">
        <div class="result-header">
          <span id="result-verdict-badge" class="badge">--</span>
          <span id="result-score" class="score-mono">--% Risk</span>
        </div>
        <p id="result-desc" class="result-desc">--</p>
      </div>
    </div>

    <!-- Actions Section -->
    <div class="actions-grid">
      <button id="btn-dashboard" class="btn-action">📊 Open Dashboard</button>
      <button id="btn-admin" class="btn-action">🔐 Admin Panel</button>
      <button id="btn-upgrade" class="btn-action btn-gold">⭐ Upgrade Tier</button>
    </div>

    <!-- Tier Unlock Section -->
    <div class="section-card unlock-card">
      <span class="unlock-title">🔑 Enter License Key / Passcode</span>
      <div class="input-group">
        <input type="password" id="passcode-input" placeholder="Enter key (e.g. porosh, zenith)" />
        <button id="unlock-btn" class="btn-secondary">Unlock</button>
      </div>
      <p id="unlock-msg" class="unlock-msg hidden"></p>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span>ZENITH v2.0 • Cyber Threat Cloud</span>
      <span id="tier-badge" class="tier-pill">LITE</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
